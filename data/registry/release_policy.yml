# Which database releases keep their parquet in the archive, and for how long.
# Read by scripts/thin_releases.R (which deletes) and by release_database.qmd
# (which stamps `consolidated` / `retired` into versions.json), so the two can
# never disagree. Decided 2026-08-25 — see .claude/plans/2026-08-25 Database
# changelog … .md, Part 2, and RELEASES.md.
#
# A consolidated version keeps its parquet indefinitely: it marks a schema or
# data milestone that docs, papers or apps pin. Every other version keeps its
# sidecars (catalog.json, metadata.json, relationships.json, RELEASE_NOTES.md —
# the record stays complete) and loses its parquet/ prefix once it is neither
# the promoted version nor the one before it; a retired.json says where to go.
consolidated:
  - v2026.04.08   # last release of the per-dataset schema (before the core obs/sample family)
  - v2026.05.14   # docs examples pin it; first ctd_thin
  - v2026.06.26   # zoodb + zooscan enter the release
  - v2026.07.17   # unified taxon / dataset_taxon
  - v2026.08.14   # dungeness-crab enters; last release before content-addressing
  - v2026.08.25   # cruise_key by span, depth ceiling + seafloor ratchet, quality flags mapped
# always kept in addition: the promoted version (latest.txt) and its predecessor
keep_latest: 2
