    tier: "1 · operational stability"
    scope: cast, profile and bottle data
    action: Migrate the bottle database into a non-proprietary relational database
    lead: Rasmus Swalethorp
    status: awaiting finalization of the CTD profile database and training
    where: [server-access.qmd, ctd-qaqc.qmd]
