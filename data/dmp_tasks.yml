# The SIO-CalCOFI Data Management Plan's action plan, mirrored from the team's Google Sheet
# ("FINAL PROPOSAL_CalCOFI DMP actions", tabs FINAL PROPOSAL and Status) so the book can show it:
# the Sheet is private, and the book's build must never depend on Google auth. Authored by hand,
# refreshed with each quarterly status entry (docs/status.qmd); `status` is the Status tab's
# sentence, condensed; `where` names the chapters or products a task's deliverable lives in.
updated: 2026-09-08
source: https://docs.google.com/spreadsheets/d/1r5xs4SzLlY1pDzdAYb5viW8Lg5v-410WfTGPBVsX3aM
period: 2026-09-01 to 2028-08-31 (two years; Year 1 is the 2026-09 to 2027-08 Ocean Metrics SoW)
phases:
  - Ingest
  - Publish
  - Integrate
  - Visualize
  - Synthesize
tasks:
