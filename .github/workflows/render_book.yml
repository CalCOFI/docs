name: Publish Quarto book

# Two jobs, on purpose. The site (HTML) renders and publishes on its own and is the
# only thing that can fail this workflow. The PDF and DOCX are built afterwards,
# never block the site, and land as the assets of the rolling `documents` release
# (https://github.com/CalCOFI/docs/releases/tag/documents), which the sidebar links.
# Until 2026-09-08 one `quarto publish` rendered all four formats and a `&` in a dataset
# name took the whole site down for a day (git log 2026-09-07). Diagrams are SVGs
# pre-rendered by libs/render_diagrams.sh and committed, so no Chromium is installed here.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  QUARTO_VERSION: 1.8.25
  R_VERSION: 4.5.1

jobs:
  publish-html:
    name: Render & publish the site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3

      - name: Render (html) — libs/pre-render.R snapshots the record first
        run: quarto render --to html
        env:
          CALCOFI_DOCS_REFRESH: "1"

      - name: Check every external link answers
        run: Rscript libs/check_links.R

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-documents:
    name: Build the PDF and DOCX (non-blocking)
    needs: publish-html
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - uses: r-lib/actions/setup-tinytex@v2

      - name: librsvg (rasterises the SVG diagrams for LaTeX)
        run: sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3

      # each render empties _book, so every document is copied aside before the next one runs
      - name: Render (docx)
        run: quarto render --to docx && mkdir -p documents && cp _book/*.docx documents/
        continue-on-error: true
        env:
          CALCOFI_DOCS_REFRESH: "1"

      - name: Render (pdf)
        run: quarto render --to pdf && mkdir -p documents && cp _book/*.pdf documents/
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: documents
          path: documents/*
          if-no-files-found: warn

      - name: Publish as the assets of the rolling `documents` release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: documents
          name: CalCOFI.io documentation — latest build
          body: >-
            The PDF and DOCX of https://calcofi.io/docs/, rebuilt on every push to main.
            The assets are replaced each time; the tag does not move.
          files: documents/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
