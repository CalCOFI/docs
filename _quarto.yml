project:
  type: book
  output-dir: _book
  resources:
  - "/.nojekyll"
  - "match/"   # standalone DuckDB-WASM Match app (see chapters: data-access, helpers, api)
  # pre-render:
  #   - libs/pre-render.R
  post-render:
    - libs/post-render.R

editor:
  mode: source

execute:
  echo: false
  warning: false

book:
  title: "CalCOFI.io"
  subtitle: "Documentation"
  description: "Documentation for open-Source products at CalCOFI.io developed
    for California Cooperative Oceanic Fisheries Investigations (CalCOFI.org)"
  author:
  - name: "Benjamin D. Best"
    orcid: 0000-0002-2686-0784
    email: ben@oceanmetrics.io
    affiliations:
      - name: Ocean Metrics LLC
  - name: "Erin Satterthwaite"
    email: esatterthwaite@ucsd.edu
    affiliations:
      - name: UC San Diego - Scripps Institution of Oceanography
        city: San Diego
        state: CA
  # author:
  #   - "![](/figs/contrib.rocks.svg)"
  date: today
  date-format: "YYYY-MM-DD"
  site-url: https://calcofi.io/docs/
  repo-url: https://github.com/CalCOFI/docs/
  repo-actions: [edit]
  downloads: [pdf, docx, epub]
  sharing: [twitter, facebook, linkedin]
  google-analytics: "G-0HVK8TDMCF"
  search: true
  page-navigation: true
  # calcofi.io brand contract (https://calcofi.io/brand/v1/): the CalCOFI favicon
  # set; in the sidebar quarto owns, the CalCOFI logo linking to calcofi.io with
  # the product title ("docs") beside it linking to this book's root. the theme
  # half (both stylesheets, quarto's toggle bridged) is under format.html below.
  # favicon.png is https://calcofi.io/brand/v1/favicon-32x32.png (quarto rewrites a URL here to ./https://...)
  favicon: favicon.png
  sidebar:
    title: docs
    logo:
      light: {path: https://calcofi.io/brand/v1/logo_calcofi_light.svg, alt: CalCOFI}
      dark: {path: https://calcofi.io/brand/v1/logo_calcofi.svg, alt: CalCOFI}
    logo-href: https://calcofi.io
  chapters:
    - index.qmd
    - reports.qmd
    - apps.qmd
    - maps.qmd
    - db.qmd
    - data-access.qmd
    - server-access.qmd
    - helpers.qmd
    - api.qmd
    - portals.qmd
    - status.qmd
    - refs.qmd

bibliography: ["refs/packages.bib"]
bibliographystyle: apa
link-citations: true

format:
  html:
    # light is listed first, so it is quarto's default and its localStorage
    # "quarto-color-scheme" sentinel reads "alternate" for dark; brand-head.html
    # seeds that sentinel from the cross-site theme and bridges the toggle
    theme:
      light: [cosmo, brand-light.scss]
      dark: [cosmo, brand-dark.scss]
    include-in-header: brand-head.html
    # css: libs/style.css
    toc: true
    number-sections: true
  docx:
    toc: true
    echo: false
    number-sections: true
    highlight-style: github
    keep-md: true # see libs/post-render.R
  pdf:
    documentclass: scrreprt
    # keep-tex: true  # for debugging
    # include-in-header: libs/preamble.tex
    nocite: |
      @*
  epub: default



