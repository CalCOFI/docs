project:
  type: book
  output-dir: _book
  resources:
  - "/.nojekyll"
  - "match/"   # standalone DuckDB-WASM Match app (see chapters: data-access, api)
  # the diagram viewer (libs/diagram.js): every .cc-diagram figure becomes an inline SVG
  # with pan, zoom and fullscreen; the pdf keeps the static image
  - "libs/diagram.js"
  - "libs/diagram.css"
  - "libs/svg-pan-zoom.min.js"
  # the brand's words in quarto's navbar (brand v3 § 4.6), read from calcofi.io's nav.json
  - "libs/brand-nav.js"
  # the one place the network is touched at render time: snapshots the promoted
  # release's sidecars, the workflows registries and the product cards under data/
  pre-render:
    - libs/pre-render.R
  post-render:
    - libs/post-render.R

editor:
  mode: source

execute:
  echo: false
  warning: false

book:
  title: "CalCOFI.io"
  subtitle: "Documentation"
  # the file name of the pdf/docx built by the second CI job and linked from sidebar.tools
  output-file: "CalCOFI.io-docs"
  description: "Documentation for open-Source products at CalCOFI.io developed
    for California Cooperative Oceanic Fisheries Investigations (CalCOFI.org)"
  author:
  - name: "Benjamin D. Best"
    orcid: 0000-0002-2686-0784
    email: ben@oceanmetrics.io
    affiliations:
      - name: Ocean Metrics LLC
  - name: "Erin Satterthwaite"
    email: esatterthwaite@ucsd.edu
    affiliations:
      - name: UC San Diego - Scripps Institution of Oceanography
        city: San Diego
        state: CA
  - name: "Betty Huang"
    email: bthuang@ucsd.edu
    affiliations:
      - name: UC San Diego - Scripps Institution of Oceanography
        city: San Diego
        state: CA
  date: today
  date-format: "YYYY-MM-DD"
  site-url: https://calcofi.io/docs/
  repo-url: https://github.com/CalCOFI/docs/
  repo-actions: [edit]
  sharing: [twitter, facebook, linkedin]
  google-analytics: "G-0HVK8TDMCF"
  # with a navbar quarto would move the search into it; the book keeps it in the sidebar
  # (and in the breadcrumb row on a phone), where it was
  search:
    location: sidebar
  page-navigation: true
  # the same line calcofi.io's own footer carries (CalCOFI.github.io#56)
  page-footer:
    center: "[How we use AI](https://calcofi.io/ai-use/)"
  # calcofi.io brand contract v3 (https://calcofi.io/brand/v3/, § 4.6: a bar a framework owns).
  # quarto owns the navbar, so the horizontal lockup sits in its brand slot linking to
  # calcofi.io, with the product title ("Docs") beside it; libs/brand-nav.js points the title
  # at this book's root (quarto gives the logo and the title one href) and draws the brand's
  # words into the navbar from https://calcofi.io/brand/v3/nav.json, so they are not typed here.
  # the theme half (stylesheets, quarto's toggle bridged, the wave) is under format.html below.
  # favicon.png is https://calcofi.io/brand/v2/favicon-32x32.png (quarto rewrites a URL here to ./https://...)
  favicon: favicon.png
  navbar:
    title: Docs
    logo:
      light: {path: https://calcofi.io/brand/v2/logo_calcofi_h_light.svg, alt: CalCOFI.io}
      dark: {path: https://calcofi.io/brand/v2/logo_calcofi_h.svg, alt: CalCOFI.io}
    logo-href: https://calcofi.io
    collapse-below: lg
    # the lockup stays far left on a phone; the menu button goes right, beside the toggle
    toggle-position: right
    # quarto draws the menu button and the collapsing list only for a navbar that has an item.
    # this one is the stand-in libs/brand-nav.js replaces with the brand's words; it shows only
    # with javascript off or when nav.json cannot be read, and then leads to where the words are
    right:
      - text: "calcofi.io"
        href: https://calcofi.io
  sidebar:
    # the pdf and docx are built by the non-blocking second CI job and published as the
    # assets of the rolling `documents` release, so these links never dangle when a
    # LaTeX or Word export fails (see .github/workflows/render_book.yml)
    tools:
      - icon: file-earmark-pdf
        text: PDF
        href: https://github.com/CalCOFI/docs/releases/download/documents/CalCOFI.io-docs.pdf
      - icon: file-earmark-word
        text: DOCX
        href: https://github.com/CalCOFI/docs/releases/download/documents/CalCOFI.io-docs.docx
  # parts by audience; the DMP's five phases are the spine of index.qmd and status.qmd
  chapters:
    - index.qmd
    - part: "Use the data"
      chapters:
        - faq.qmd
        - explore.qmd
        - data-access.qmd
        - cite.qmd
    - part: "Understand the database"
      chapters:
        - db.qmd
        - keys.qmd
        - naming.qmd
        - releases.qmd
    - part: "Contribute data"
      chapters:
        - provide.qmd
        - metadata.qmd
        - portals.qmd
    - part: "Work with the team"
      chapters:
        - server-access.qmd
        - ctd-qaqc.qmd
        - ingest-loop.qmd
        - products.qmd
    - part: "The plan and the record"
      chapters:
        - dmp.qmd
        - architecture.qmd
        - status.qmd
  appendices:
    - api.qmd
    - glossary.qmd
    - refs.qmd

# refs/refs.bib is the literature; refs/packages.bib the software. Cite with [@key];
# the bibliography renders in the References appendix (refs.qmd, the ::: {#refs} div).
bibliography: ["refs/refs.bib", "refs/packages.bib"]
bibliographystyle: apa
link-citations: true

format:
  html:
    # light is listed first, so it is quarto's default and its localStorage
    # "quarto-color-scheme" sentinel reads "alternate" for dark; brand-head.html
    # seeds that sentinel from the cross-site theme and bridges the toggle
    theme:
      light: [cosmo, brand-light.scss, brand-navbar.scss]
      dark: [cosmo, brand-dark.scss, brand-navbar.scss]
    include-in-header: brand-head.html
    # the wave under the navbar (brand v3 § 4.5)
    include-before-body: brand-wave.html
    toc: true
    number-sections: true
    # every figure — the pre-rendered SVG diagrams above all — opens full-size
    lightbox: true
  docx:
    toc: true
    echo: false
    number-sections: true
    highlight-style: github
    keep-md: true # see libs/post-render.R
  pdf:
    documentclass: scrreprt
    nocite: |
      @*
