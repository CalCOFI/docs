project:
  type: book
  output-dir: _book
  resources:
  - "/.nojekyll"
  - "match/"   # standalone DuckDB-WASM Match app (see chapters: data-access, api)
  # the one place the network is touched at render time: snapshots the promoted
  # release's sidecars, the workflows registries and the product cards under data/
  pre-render:
    - libs/pre-render.R
  post-render:
    - libs/post-render.R

editor:
  mode: source

execute:
  echo: false
  warning: false

book:
  title: "CalCOFI.io"
  subtitle: "Documentation"
  # the file name of the pdf/docx built by the second CI job and linked from sidebar.tools
  output-file: "CalCOFI.io-docs"
  description: "Documentation for open-Source products at CalCOFI.io developed
    for California Cooperative Oceanic Fisheries Investigations (CalCOFI.org)"
  author:
  - name: "Benjamin D. Best"
    orcid: 0000-0002-2686-0784
    email: ben@oceanmetrics.io
    affiliations:
      - name: Ocean Metrics LLC
  - name: "Erin Satterthwaite"
    email: esatterthwaite@ucsd.edu
    affiliations:
      - name: UC San Diego - Scripps Institution of Oceanography
        city: San Diego
        state: CA
  date: today
  date-format: "YYYY-MM-DD"
  site-url: https://calcofi.io/docs/
  repo-url: https://github.com/CalCOFI/docs/
  repo-actions: [edit]
  sharing: [twitter, facebook, linkedin]
  google-analytics: "G-0HVK8TDMCF"
  search: true
  page-navigation: true
  # calcofi.io brand contract (https://calcofi.io/brand/v2/): the CalCOFI favicon
  # set; in the sidebar quarto owns, the horizontal lockup (logo_calcofi_h*.svg,
  # 36 px — the mark alone is v1) linking to calcofi.io with the product title
  # ("docs") beside it linking to this book's root. the theme half (both
  # stylesheets, quarto's toggle bridged) is under format.html below.
  # favicon.png is https://calcofi.io/brand/v2/favicon-32x32.png (quarto rewrites a URL here to ./https://...)
  favicon: favicon.png
  sidebar:
    title: docs
    logo:
      light: {path: https://calcofi.io/brand/v2/logo_calcofi_h_light.svg, alt: CalCOFI}
      dark: {path: https://calcofi.io/brand/v2/logo_calcofi_h.svg, alt: CalCOFI}
    logo-href: https://calcofi.io
    # the pdf and docx are built by the non-blocking second CI job and published as the
    # assets of the rolling `documents` release, so these links never dangle when a
    # LaTeX or Word export fails (see .github/workflows/render_book.yml)
    tools:
      - icon: file-earmark-pdf
        text: PDF
        href: https://github.com/CalCOFI/docs/releases/download/documents/CalCOFI.io-docs.pdf
      - icon: file-earmark-word
        text: DOCX
        href: https://github.com/CalCOFI/docs/releases/download/documents/CalCOFI.io-docs.docx
  chapters:
    - index.qmd
    - reports.qmd
    - apps.qmd
    - db.qmd
    - metadata.qmd
    - data-access.qmd
    - cite.qmd
    - server-access.qmd
    - helpers.qmd
    - api.qmd
    - portals.qmd
    - status.qmd
    - refs.qmd

bibliography: ["refs/packages.bib"]
bibliographystyle: apa
link-citations: true

format:
  html:
    # light is listed first, so it is quarto's default and its localStorage
    # "quarto-color-scheme" sentinel reads "alternate" for dark; brand-head.html
    # seeds that sentinel from the cross-site theme and bridges the toggle
    theme:
      light: [cosmo, brand-light.scss]
      dark: [cosmo, brand-dark.scss]
    include-in-header: brand-head.html
    toc: true
    number-sections: true
    # every figure — the pre-rendered SVG diagrams above all — opens full-size
    lightbox: true
  docx:
    toc: true
    echo: false
    number-sections: true
    highlight-style: github
    keep-md: true # see libs/post-render.R
  pdf:
    documentclass: scrreprt
    nocite: |
      @*
