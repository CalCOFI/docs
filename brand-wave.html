<!-- calcofi.io brand v3 § 4.5: the wave, a navy band directly under the bar on every page (drawn by
     https://calcofi.io/brand/v3/header.css). quarto puts an include-before-body at the top of <main>,
     inside the article column, and offers no place between its header and the page; the line below
     lifts the band out to stand there, full width, before anything is painted under it. with
     javascript off it stays where quarto put it, at the head of the column. -->
<div class="cc-wave cc-wave-slim" id="cc-wave" aria-hidden="true"></div>
<script>(function () { var w = document.getElementById("cc-wave"), c = document.getElementById("quarto-content"); if (w && c && c.parentNode) c.parentNode.insertBefore(w, c); })();</script>
