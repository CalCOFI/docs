<!-- calcofi.io brand contract (https://calcofi.io/brand/v1/) for this quarto book.
     quarto owns the sidebar and the dark/light toggle: window.quartoToggleColorScheme()
     flips the quarto-dark / quarto-light class on <body> and stores its choice in
     localStorage "quarto-color-scheme" as "default" (the FIRST theme in _quarto.yml,
     light) or "alternate" (dark). the favicon and logo come from book.favicon and
     book.sidebar in _quarto.yml; this file carries the theme half of the contract. -->
<script>(function(){var m=/[?&]theme=(dark|light)\b/.exec(location.search),c=/(?:^|;\s*)cc_theme=(dark|light)/.exec(document.cookie),s=null;try{s=localStorage.getItem("theme")}catch(e){}var t=(m&&m[1])||(c&&c[1])||(s==="light"||s==="dark"?s:null)||"dark",d=document.documentElement;d.dataset.theme=t;d.setAttribute("data-bs-theme",t);d.style.colorScheme=t;
/* seed quarto's sentinel before its before-body script reads it, so the first paint is already the resolved theme */
try{localStorage.setItem("quarto-color-scheme",t==="dark"?"alternate":"default")}catch(e){}})();</script>
<link rel="stylesheet" href="https://calcofi.io/brand/v1/theme.css">
<script defer src="https://calcofi.io/brand/v1/theme.js"></script>
<style>
  /* quarto's toggle draws bootstrap's toggle-off / toggle-on switch — a glyph that says
     nothing about what it does. Dress it in the brand pair instead (theme.css exports the
     masks): the sun while the page is dark, the moon-in-sun while it is light — what a click
     switches to, as on calcofi4py. Keyed on our data-theme rather than quarto's .alternate:
     the bridge below keeps the two in step, and ours is already right at first paint.
     !important on the image: quarto sets it per theme and per position at equal specificity. */
  .quarto-color-scheme-toggle .bi::before {
    background-image: none !important; background-color: currentColor;
    width: 1.15rem !important; height: 1.15rem !important; vertical-align: -0.2em;
    -webkit-mask: var(--cc-icon-moon) center / contain no-repeat;
            mask: var(--cc-icon-moon) center / contain no-repeat;
  }
  :root:not([data-theme="light"]) .quarto-color-scheme-toggle .bi::before {
    -webkit-mask-image: var(--cc-icon-sun); mask-image: var(--cc-icon-sun);
  }
</style>
<script>(function(){
  var root = document.documentElement;
  function quartoDark() { return document.body.classList.contains("quarto-dark"); }
  // brand -> quarto: flip quarto's scheme when it disagrees with the given theme
  function pushToQuarto(t) {
    if ((t === "dark") !== quartoDark() && window.quartoToggleColorScheme) window.quartoToggleColorScheme();
  }
  // quarto -> brand: the body class is what quarto's toggle changes; mirror it into ccTheme (cookie + event)
  function pullFromQuarto() {
    var t = quartoDark() ? "dark" : "light";
    if (window.ccTheme && ccTheme.get() !== t) ccTheme.set(t);
  }
  document.addEventListener("DOMContentLoaded", function () {
    pushToQuarto(root.dataset.theme === "light" ? "light" : "dark");   // (a) on load the resolved theme wins (a ?theme= link, the cross-site cookie)
    new MutationObserver(pullFromQuarto).observe(document.body, { attributes: true, attributeFilter: ["class"] });   // (b) quarto's toggle
    document.addEventListener("cc:theme", function (e) { pushToQuarto(e.detail.theme); });   // (c) a brand toggle, if a page ever adds one
  });
})();</script>
