<!-- calcofi.io brand contract v2 (https://calcofi.io/brand/v2/; light default since 2026-09-04) for this quarto book.
     quarto owns the sidebar and the dark/light toggle: window.quartoToggleColorScheme()
     flips the quarto-dark / quarto-light class on <body> and stores its choice in
     localStorage "quarto-color-scheme" as "default" (the FIRST theme in _quarto.yml,
     light) or "alternate" (dark). the favicon and logo come from book.favicon and
     book.sidebar in _quarto.yml; this file carries the theme half of the contract. -->
<script>(function(){var d=document.documentElement,m=/[?&]theme=(dark|light)\b/.exec(location.search),k=/(?:^|;\s*)cc_theme_src=user\b/.test(document.cookie),c=k&&/(?:^|;\s*)cc_theme=(dark|light)\b/.exec(document.cookie),s=null;try{if(localStorage.getItem("cc_theme_src")==="user")s=localStorage.getItem("cc_theme")}catch(e){}var t=(m&&m[1])||(c&&c[1])||(s==="dark"||s==="light"?s:null)||"light";d.dataset.theme=t;d.setAttribute("data-bs-theme",t);d.setAttribute("data-md-color-scheme",t==="dark"?"slate":"default");d.style.colorScheme=t;/* seed quarto's sentinel before its before-body script reads it, so the first paint is already the resolved theme */
try{localStorage.setItem("quarto-color-scheme",t==="dark"?"alternate":"default")}catch(e){}})();</script>
<link rel="preload" href="https://calcofi.io/brand/v2/fonts/SourceSans3-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://calcofi.io/brand/v2/fonts.css">
<link rel="stylesheet" href="https://calcofi.io/brand/v2/theme.css">
<script defer src="https://calcofi.io/brand/v2/theme.js"></script>
<style>
  /* quarto's toggle draws bootstrap's toggle-off / toggle-on switch — a glyph that says
     nothing about what it does. Dress it in the brand pair instead (theme.css exports the
     masks): the sun while the page is dark, the moon-in-sun while it is light — what a click
     switches to, as on calcofi4py. Keyed on our data-theme rather than quarto's .alternate:
     the bridge below keeps the two in step, and ours is already right at first paint.
     !important on the image: quarto sets it per theme and per position at equal specificity. */
  .quarto-color-scheme-toggle .bi::before {
    background-image: none !important; background-color: currentColor;
    width: 1.15rem !important; height: 1.15rem !important; vertical-align: -0.2em;
    -webkit-mask: var(--cc-icon-moon) center / contain no-repeat;
            mask: var(--cc-icon-moon) center / contain no-repeat;
  }
  :root:not([data-theme="light"]) .quarto-color-scheme-toggle .bi::before {
    -webkit-mask-image: var(--cc-icon-sun); mask-image: var(--cc-icon-sun);
  }
</style>
<script>(function(){
  var root = document.documentElement;
  function quartoDark() { return document.body.classList.contains("quarto-dark"); }
  // brand -> quarto: flip quarto's scheme when it disagrees with the given theme
  function pushToQuarto(t) {
    if ((t === "dark") !== quartoDark() && window.quartoToggleColorScheme) window.quartoToggleColorScheme();
  }
  // quarto -> brand: the body class is what quarto's toggle changes; mirror it into ccTheme (cookie + event)
  function pullFromQuarto() {
    var t = quartoDark() ? "dark" : "light";
    if (window.ccTheme && ccTheme.get() !== t) ccTheme.set(t);
  }
  document.addEventListener("DOMContentLoaded", function () {
    pushToQuarto(root.dataset.theme === "light" ? "light" : "dark");   // (a) on load the resolved theme wins (a ?theme= link, the cross-site cookie)
    new MutationObserver(pullFromQuarto).observe(document.body, { attributes: true, attributeFilter: ["class"] });   // (b) quarto's toggle
    document.addEventListener("cc:theme", function (e) { pushToQuarto(e.detail.theme); });   // (c) a brand toggle, if a page ever adds one
  });
})();</script>

<!-- feedback (2026-09-08): the fleet's feedback dialog — calcofi.io/assets/feedback.{css,js}, the Explorer's
     annotated-screenshot dialog ported to plain JS — with this book's own trigger: a speech-bubble sidebar
     tool inserted just before quarto's theme toggle on DOMContentLoaded (feedback.js binds on DOM ready and
     reads endpoint / repo / app from the button). The endpoint is the "CalCOFI app feedback" Apps Script the
     Explorer and calcofi.io use (calcofi4r::cc_feedback_script()); app "docs" — the script maps an app to
     the repo its public issue is filed in, and needs `docs = "CalCOFI/docs"` in its repos= for that step. -->
<link rel="stylesheet" href="https://calcofi.io/assets/feedback.css">
<script defer src="https://calcofi.io/assets/feedback.js"></script>
<style>
  /* the sidebar tool: quarto's tools are 1 rem bootstrap glyphs on the sidebar's text colour; the bubble is an
     inline SVG at the same size, so it sits level with the share and toggle icons */
  .cc-feedback.quarto-navigation-tool { display: inline-flex; align-items: center; vertical-align: middle; }
  .cc-feedback.quarto-navigation-tool svg { width: 1.05rem; height: 1.05rem; fill: currentColor; }
  /* the dialog's buttons and inputs inherit bootstrap's font-size / line-height; hold them to the brand's */
  dialog.fb { font-size: 16px; }
  dialog.fb code { color: var(--fg); background: var(--panel); }   /* not bootstrap's pink */
</style>
<script>document.addEventListener("DOMContentLoaded", function () {
  var toggle = document.querySelector(".quarto-color-scheme-toggle");
  if (!toggle || document.querySelector(".cc-feedback")) return;
  var a = document.createElement("a");
  a.href = ""; a.className = "cc-feedback quarto-navigation-tool px-1"; a.title = "Send feedback — with a screenshot of this page"; a.setAttribute("aria-label", "Send feedback");
  a.setAttribute("data-endpoint", "https://script.google.com/macros/s/AKfycby8SIv9aBTXGBqKpPxLGox6YV2ZvqXwxvpwFq7Z9uFWLS8ik38_bADnMKlOJ_JolcfI/exec");
  a.setAttribute("data-repo", "CalCOFI/docs"); a.setAttribute("data-app", "docs");
  a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20,2A2,2 0 0,1 22,4V16A2,2 0 0,1 20,18H6L2,22V4C2,2.89 2.9,2 4,2H20M4,4V17.17L5.17,16H20V4H4M6,7H18V9H6V7M6,11H15V13H6V11Z"/></svg>';
  toggle.parentNode.insertBefore(a, toggle);
  if (window.ccFeedback) ccFeedback.mount();   // the fleet script may already have run its own ready hook
});</script>
